name: ubuntu2204

on:
  push:
    branches: [ main, 'stb-tester-node/*' ]
  pull_request:
    branches: [ main, 'stb-tester-node/*' ]

jobs:
  make_check:
    runs-on: ubuntu-latest
    container:
      image: stbtester/ci:ubuntu2204
      env:
        python_version: 3
        LANG: en_GB.UTF-8
        SHELL: /bin/bash
        TERM: xterm
    steps:
    - uses: actions/checkout@v3
    - run: git config --global --add safe.directory /__w/stb-tester/stb-tester
    - run: tesseract --version
    - run: make check-pylint
    - run: pyright --version && make check-pyright
    - run: make check-pytest
    - run: make check-integrationtests
    - name: PaddleOCR tests
      # paddleocr needs newer numpy & opencv than Ubuntu's, so we only use
      # them for these tests.
      run: |
        pip3 install --target /tmp/paddleocr \
            paddleocr==3.7.0 onnxruntime==1.23.2 &&
        export PYTHONPATH=/tmp/paddleocr:$PWD &&
        python3 -c "from _stbt import ocr; ocr._paddleocr_pipeline()" &&
        python3 -m pytest -p no:anyio -k paddleocr tests/test_ocr.py
