[project]
name = "stbt_core"
version = "34.12.0"
authors = [
    { name = "Stb-tester.com Ltd.", email = "support@stb-tester.com" },
]
description = "Automated GUI testing for Set-Top Boxes"
readme = "docs/package-readme.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = [
    # Intentionally blank. There are 2 client types for this package:
    # 1. Clients of the stb-tester.com Node. The clients don't run the package
    #    themselves, but install the package in their dev environment. Such
    #    clients should install, at a minimum, the `stb_tester_node` optional
    #    dependency.
    # 2. Clients that run the package themselves. Such clients should install,
    #    at a minimum, the `runtime` optional dependency.
]

[project.urls]
"Home Page" = "https://stb-tester.com"

[project.optional-dependencies]
runtime = [
    "attrs",
    "lmdb",
    "numpy",
    "opencv-python-headless",
    "PyGObject<3.51",  # <3.51 because of https://pypi.org/project/PyGObject/3.51.0.dev0/
    "xxhash",
]
ocr = [
    "lxml",
]
aten_pe6108g = [
    "pysnmp<5",
    "pyasn1<0.6.1",  # Required due to a bug in pysnmp's packaging, same below
]
apc7xxx = [
    "pysnmp<5",
    "pyasn1<0.6.1",
]
aviosys_8800_pro = [
    "pyserial",
]
debug = [
    "Jinja2",
    "IPython<8",
    "markupsafe"
]
keyboard = [
    "networkx",
]
roku = [
    "requests",
]
stb_tester_node = [
    # These are precise pins needed to be 100% compatible with the stb-tester.com Node.
    "astroid==2.11.6",
    "attrs==21.2.0",
    "opencv-python-headless~=4.5",
    "pylint==2.14.3",
]

[dependency-groups]
deps = [
    "deptry",
]
type = [
    "pyright[nodejs]",
]
lint = [
    "pycodestyle",
    "pylint",
    "pytest",
]
test = [
    "pytest",
    "responses",
]

[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "stbt_core",
    "_stbt",
]

[tool.setuptools.package-data]
_stbt = [
    "stbt.conf",
]

[tool.setuptools]
ext-modules = [
    { name = "_stbt._libstbt", sources = ["_stbt/sqdiff.c"] },
]

[tool.pylint.master]
persistent = false
extension-pkg-whitelist = [
    "_stbt._libstbt",
    "cv2",
    "lxml",
    "numpy",
]
init-hook = """
import gi
gi.require_version("Gst", "1.0")
from gi.repository import Gst
Gst.init()
"""

[tool.pylint.reports]
msg-template = "{path}:{line}:{column}: [{msg_id}({symbol}), {obj}] {msg}"
reports = false

[tool.pylint.messages_control]
disable = [
    "bad-classmethod-argument",
    "bad-continuation",
    "bad-option-value",
    "blacklisted-name",
    "consider-using-f-string",
    "consider-using-with",
    "cyclic-import",
    "duplicate-code",
    "empty-docstring",
    "fixme",
    "global-statement",
    "import-outside-toplevel",
    "inconsistent-return-statements",
    "invalid-name",
    "len-as-condition",
    "locally-disabled",
    "locally-enabled",
    "misplaced-comparison-constant",
    "missing-docstring",
    "multiple-statements",
    "no-else-break",
    "no-else-continue",
    "no-else-raise",
    "no-else-return",
    "no-init",
    "no-self-use",
    "protected-access",
    "raise-missing-from",
    "singleton-comparison",
    "too-few-public-methods",
    "too-many-ancestors",
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
    "ungrouped-imports",
    "unnecessary-lambda-assignment",
    "use-implicit-booleaness-not-comparison",
    "wrong-import-position",
]
ignored-modules = [
    "cv2",
]
ignored-classes = [
    "Buffer",
    "Caps",
    "cec",
    "Client",
    "Event",
    "Frame",
    "generator",
    "gi.repository.Gst",
    "MainLoop",
    "numpy",
    "pytest",
    "Sample",
    "_socketobject",
]

[tool.pylint.classes]
valid-metaclass-classmethod-first-arg = "mcs"

[tool.pylint.imports]
analyse-fallback-blocks = false

[tool.pylint.variables]
dummy-variables-rgx = "_"

[tool.pylint.format]
max-line-length = 80
ignore-long-lines = "https?://|# pyright:"

[tool.pytest.ini_options]
python_functions = "test_"
addopts = [
    "-rs",
    "--verbose",
    "--verbose",
    "--doctest-modules",
]
doctest_optionflags = [
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "ELLIPSIS",
    "NORMALIZE_WHITESPACE",
]
log_level = "debug"
xfail_strict = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
exclude = [
    "**/__pycache__",
    "**/.*",
    "extra/nbstripout.py",
    "tests/test-install",
    "tests/validate-ocr.py",
]
ignore = [
    "stbt_control.py",
    "stbt_run.py",
    "_stbt/core.py",
    "_stbt/cv2_compat.py",
    "_stbt/grid.py",
    "_stbt/gst_hacks.py",
    "_stbt/gst_utils.py",
    "_stbt/imgproc_cache.py",
    "_stbt/keyboard.py",
    "_stbt/mask.py",
    "_stbt/ocr.py",
    "_stbt/power.py",
    "_stbt/precondition.py",
    "_stbt/pylint_plugin.py",
    "_stbt/sqdiff.py",
    "_stbt/stbt_run.py",
    "_stbt/types.py",
    "stbt_core/__init__.py",
    "tests/test_core.py",
    "tests/test_diff.py",
    "tests/test_frameobject.py",
    "tests/test_grid.py",
    "tests/test_keyboard.py",
    "tests/test_mask.py",
    "tests/test_match.py",
    "tests/test_ocr.py",
    "tests/test_stbt_debug.py",
    "tests/test_transition.py",
]

[tool.deptry]
known_first_party = [
    "stbt_core",
    "_stbt",
]
exclude = [
    "extra/nbstripout.py",
    "tests/validate-ocr.py",
]

[tool.deptry.package_module_name_map]
attrs = "attr"
IPython = "IPython"
PyGObject = "gi"
pyserial = "serial"
opencv-python-headless = "cv2"

[tool.deptry.per_rule_ignores]
# DEP001: imported but not declared as a dependency
DEP001 = [
    # cec is provide only by `python3-cec` in Ubuntu, so it's a dependency listed in this file.
    "cec",
    # "numba" is only used in a performance test of `sqdiff.py`
    "numba",
]
# DEP002: declared as a dependency but not imported
DEP002 = [
    # "pyasn1" is a dependency of `pysnmp`, which has a bug in its packaging that requires us to explicitly depend on it.
    "pyasn1",
]
# DEP004: declared as a dev dependency but imported in production code
# These *are* dev dependencies, but the tests they are used for are in the
# production modules.
DEP004 = [
    "pytest",
    "responses",
]
